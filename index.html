<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Pilotest - Cadets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">
    
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between mb-6">
        <div class="flex items-center gap-6">
            <div class="font-bold text-xl tracking-tighter text-blue-900">✈️ CADETS</div>
            <div class="flex gap-4 text-sm font-medium text-slate-500">
                <a href="#" class="hover:text-slate-800">Accueil</a>
                <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-1">Suivi de Performances</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4">
        
        <!-- Barre de sélection des Groupes & Bouton Modifier -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <!-- Boutons des groupes dynamiques -->
            <div id="groupes-nav" class="flex flex-wrap gap-2 items-center">
                <!-- Injecté par JavaScript -->
            </div>
            <!-- Bouton de configuration des groupes -->
            <button onclick="ouvrirModalGroupes()" class="text-sm font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1.5 bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Créer / Modifier les groupes
            </button>
        </div>

        <!-- Encadré d'ajout de test -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-8 p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Ajouter un test <span id="label-groupe-actif" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-normal">Groupe : Tous</span>
            </h2>
            
            <div class="flex flex-col md:flex-row gap-6 items-center">
                <div class="w-full md:w-1/3">
                    <select id="select-exercice" class="w-full border border-slate-300 rounded-lg p-3 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer appearance-none bg-slate-50">
                        <option value="">-- Sélectionner un test --</option>
                    </select>
                </div>

                <div id="zone-boutons-stanine" class="flex gap-2 opacity-30 pointer-events-none transition-opacity duration-300">
                    <span class="text-sm text-slate-500 font-medium mr-2 flex items-center">Score :</span>
                </div>
            </div>
            <p id="message-confirmation" class="text-green-600 text-sm font-medium mt-4 hidden">✅ Score enregistré avec succès !</p>
        </div>

        <!-- Liste des exercices (Bandeaux filtrés) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-8 overflow-hidden">
            <div class="grid grid-cols-12 gap-4 p-4 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider bg-slate-50">
                <div class="col-span-8">Exercice</div>
                <div class="col-span-2 text-center">Moyenne</div>
                <div class="col-span-2 text-center">Dernier</div>
            </div>
            <div id="exercices-list" class="max-h-[450px] overflow-y-auto">
                <!-- Injecté par JS -->
            </div>
        </div>

        <!-- Section Graphique -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h2 id="titre-graphique" class="text-lg font-semibold text-slate-800 mb-2 uppercase tracking-wide text-sm">Sélectionnez un exercice pour voir l'évolution</h2>
            <div class="relative h-72 w-full mt-4">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>
    </main>

    <!-- MODALE DE GESTION DES GROUPES -->
    <div id="modal-groupes" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-900">Gestion des Groupes d'Exercices</h3>
                <button onclick="fermerModalGroupes()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <!-- Créer un groupe -->
            <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <h4 class="text-sm font-semibold text-slate-700 mb-2">Créer un nouveau groupe</h4>
                <div class="flex gap-2">
                    <input type="text" id="input-nom-groupe" placeholder="Ex: PSY0, Anglais..." class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="creerGroupe()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Créer</button>
                </div>
            </div>

            <!-- Liste des groupes existants & affectation des exercices -->
            <div id="liste-gestion-groupes" class="space-y-4">
                <!-- Injecté par JS -->
            </div>

            <div class="mt-6 text-right">
                <button onclick="fermerModalGroupes()" class="bg-slate-800 text-white px-5 py-2 rounded-xl text-sm font-medium hover:bg-slate-900">Fermer</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
